version: '3.8'
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: transport_system
      MYSQL_USER: transport
      MYSQL_PASSWORD: transportpass
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - transport-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    networks:
      - transport-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file:
      - backend/.env
    ports:
      - '8000:8000'
    depends_on:
      - db
      - redis
    networks:
      - transport-net

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file:
      - backend/.env
    command: celery -A tasks.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      - db
      - redis
    networks:
      - transport-net

  beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file:
      - backend/.env
    command: celery -A tasks.celery_app beat --loglevel=info
    depends_on:
      - db
      - redis
    networks:
      - transport-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - '3000:80'
    networks:
      - transport-net

  nginx:
    image: nginx:stable
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deployment/nginx/transport-system.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/var/www/transport-system/frontend/dist:ro
    depends_on:
      - backend
      - frontend
    networks:
      - transport-net

volumes:
  db_data:
  redis_data:

networks:
  transport-net:
    driver: bridge
