<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1220" />
    <title>404 | SKDLS Transport AI</title>
    <style>
      :root{color-scheme:dark;font-family:Inter,Manrope,sans-serif}
      *{box-sizing:border-box}
      body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top left,rgba(249,115,22,.16),transparent 24%),linear-gradient(180deg,#0f172a,#020617);color:#f8fafc;padding:24px}
      .card{width:min(680px,100%);padding:32px;border-radius:28px;border:1px solid rgba(148,163,184,.16);background:linear-gradient(180deg,rgba(15,23,42,.94),rgba(8,15,28,.98));box-shadow:0 28px 72px rgba(0,0,0,.34)}
      .logo{display:inline-flex;align-items:center;gap:12px;margin-bottom:18px}
      .mark{width:52px;height:52px;border-radius:18px;background:linear-gradient(135deg,#f97316,#fb923c 48%,#22c55e);display:grid;place-items:center;font-weight:900;letter-spacing:.12em}
      h1{margin:0 0 12px;font-size:clamp(2rem,4vw,3.5rem);line-height:1.02}
      p{margin:0 0 20px;color:#cbd5e1;line-height:1.7}
      a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:999px;background:linear-gradient(135deg,#f97316,#fb923c);color:#fff;text-decoration:none;font-weight:800}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo"><div class="mark">SK</div><div><strong>SKDLS Transport AI</strong><div style="color:#94a3b8;font-size:.85rem">Premium logistics SaaS</div></div></div>
      <h1>404. Route not found.</h1>
      <p>The logistics page you requested does not exist. Return to the control center or continue to the live tracking view.</p>
      <a href="/">Return home</a>
    </main>
  </body>
</html>
